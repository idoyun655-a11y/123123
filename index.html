<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>NEON DODGER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">LUNA GAME LAB</div>
        <h1>NEON DODGER</h1>
      </div>
      <div class="stats">
        <div><span>점수</span><strong id="score">0</strong></div>
        <div><span>최고</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="game-shell">
      <canvas id="game" aria-label="NEON DODGER 게임 화면"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <div class="logo-dot"></div>
          <h2 id="overlayTitle">READY?</h2>
          <p id="overlayText">떨어지는 장애물을 피하세요.</p>
          <button id="startBtn">게임 시작</button>
          <small>PC: ← → / A D · 모바일: 화면을 좌우로 드래그</small>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="터치 조작">
      <button data-dir="-1" aria-label="왼쪽">◀</button>
      <button id="pauseBtn" aria-label="일시정지">Ⅱ</button>
      <button data-dir="1" aria-label="오른쪽">▶</button>
    </div>
    <p class="hint">속도가 점점 빨라집니다. 얼마나 오래 살아남을 수 있을까요?</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
